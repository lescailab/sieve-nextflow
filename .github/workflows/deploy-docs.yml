name: Deploy documentation

on:
  push:
    branches:
      - dev
    paths:
      - "README.md"
      - "CITATIONS.md"
      - "docs/**/*.md"
      - "guidelines/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation style
        shell: bash
        run: |
          mapfile -d '' markdown_files < <(find README.md CITATIONS.md docs guidelines -type f -name '*.md' -print0)
          if rg --line-number --pcre2 '(?i)\b(?:artifacts?|behavior|visualizations?|optimization|normalized)\b|—' "${markdown_files[@]}"; then
            echo "Documentation contains a disallowed spelling or em dash."
            exit 1
          fi

  deploy:
    needs: docs-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean
