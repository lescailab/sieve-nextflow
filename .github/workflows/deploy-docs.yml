name: Deploy documentation

on:
  push:
    branches:
      - dev
    paths:
      - "README.md"
      - "CITATIONS.md"
      - "docs/**"
      - "guidelines/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs-style:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation style
        shell: bash
        run: |
          mapfile -d '' markdown_files < <(find README.md CITATIONS.md docs guidelines -type f -name '*.md' -print0)
          set +e
          grep --line-number --with-filename --extended-regexp --ignore-case \
            '(^|[^[:alnum:]_])(artifacts?|behavior|visualizations?|optimization|normalized)([^[:alnum:]_]|$)|—' \
            "${markdown_files[@]}"
          scan_status=$?
          set -e

          case "$scan_status" in
            0)
              echo "Documentation contains a disallowed spelling or em dash."
              exit 1
              ;;
            1)
              ;;
            *)
              echo "Documentation style scan failed with exit code $scan_status."
              exit "$scan_status"
              ;;
          esac

  deploy:
    needs: docs-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean
