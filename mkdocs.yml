site_name: SIEVE Guidelines
site_description: Extended documentation for the lescailab/sieve Nextflow pipeline
repo_url: https://github.com/lescailab/sieve-nextflow
edit_uri: ""

docs_dir: guidelines
site_dir: site

theme:
  name: material
  custom_dir: guidelines/overrides
  palette:
    - scheme: default
      primary: red
      accent: red
    - scheme: slate
      primary: red
      accent: red
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Pipeline overview: pipeline-overview.md
  - Installation: installation.md
  - Running the pipeline: running-the-pipeline.md
  - Inputs: inputs.md
  - Configuration: configuration.md
  - Workflow steps: workflow-steps.md
  - Detailed outputs: outputs-detailed.md
  - Troubleshooting: troubleshooting.md
  - Reproducibility: reproducibility.md
  - Extending the pipeline: extending-the-pipeline.md
