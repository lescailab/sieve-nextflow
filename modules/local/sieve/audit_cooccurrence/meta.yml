name: sieve_audit_cooccurrence
description: Audit variant co-occurrence structure in a preprocessed SIEVE dataset.
keywords:
  - sieve
  - epistasis
  - cooccurrence
  - audit
tools:
  - sieve:
      description: Sparse Interpretable Exome Variant Explainer
      homepage: https://anaconda.org/lescailab/sieve
      documentation: https://anaconda.org/lescailab/sieve
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Metadata map for the cohort
    - preprocessed:
        type: file
        description: Preprocessed tensor generated by SIEVE preprocess
output:
  cooccurrence_dir:
    - - meta:
          type: map
          description: Metadata map for the cohort
      - cooccurrence_output:
          type: directory
          description: Directory containing co-occurrence audit outputs
  cooccurrence_pairs:
    - - meta:
          type: map
          description: Metadata map for the cohort
      - cooccurrence_per_pair.csv:
          type: file
          description: Pairwise co-occurrence summary table
  cooccurrence_summary:
    - - meta:
          type: map
          description: Metadata map for the cohort
      - cooccurrence_by_maf_bin.csv:
          type: file
          description: Co-occurrence summary aggregated by MAF bin
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - sieve:
          type: string
          description: The name of the tool
      - 1.0.0:
          type: string
          description: The version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - sieve:
          type: string
          description: The name of the tool
      - 1.0.0:
          type: string
          description: The version of the tool
authors:
  - "@lescai"
