name: sieve_bootstrap_null_calibration
description: Bootstrap-calibrate real SIEVE variant rankings against null attribution matrices.
keywords:
  - sieve
  - null baseline
  - bootstrap
  - calibration
tools:
  - sieve:
      description: Sparse Interpretable Exome Variant Explainer
      homepage: https://anaconda.org/lescailab/sieve
      documentation: https://anaconda.org/lescailab/sieve
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Metadata map
    - real_rankings:
        type: file
        description: Real model variant ranking CSV
    - null_attributions_npz:
        type: file
        description: Null-baseline attribution matrix produced by SIEVE explainability
output:
  calibrated:
    - - meta:
          type: map
          description: Metadata map
      - calibrated_rankings.csv:
          type: file
          description: Bootstrap-calibrated variant rankings
  versions: &1
    - - "${task.process}":
          type: string
          description: The name of the process
      - sieve:
          type: string
          description: The name of the tool
      - 1.3.0:
          type: string
          description: The version of the tool
authors:
  - "@lescai"
topics:
  versions: *1
