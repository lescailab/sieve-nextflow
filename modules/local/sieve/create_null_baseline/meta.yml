name: "sieve_create_null_baseline"
description: Create a permuted/null baseline preprocessed tensor for attribution comparison.
keywords:
  - sieve
  - null baseline
  - preprocessing
tools:
  - sieve:
      description: Sparse Interpretable Exome Variant Explainer
      homepage: https://anaconda.org/lescailab/sieve
      documentation: https://anaconda.org/lescailab/sieve
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: Metadata map
    - preprocessed:
        type: file
        description: Input preprocessed tensor
    - seed:
        type: integer
        description: Random seed for null baseline generation
output:
  - null_preprocessed:
      - - meta:
            type: map
            description: Metadata map
        - preprocessed_NULL.pt:
            type: file
            description: Null baseline preprocessed tensor
  - versions:
      - versions.yml:
          type: file
          description: Software versions used by the process
authors:
  - "@lescai"
