name: sieve_filter_sex_chrom_attributions
description: Filter X/Y chromosome variants from real and null attribution rankings
  before null comparison.
keywords:
- sieve
- attribution
- sex chromosomes
- filtering
tools:
- python:
    description: Python scripting language
    homepage: https://www.python.org
    documentation: https://docs.python.org/3/
    licence:
    - PSF-2.0
input:
- - meta:
      type: map
      description: Metadata map for the cohort
  - real_variant_rankings:
      type: file
      description: Real-model variant attribution rankings CSV
  - null_variant_rankings:
      type: file
      description: Null-model variant attribution rankings CSV
output:
  filtered_rankings:
  - - meta:
        type: map
        description: Metadata map for the cohort
    - real_autosomal_variant_rankings.csv:
        type: file
        description: Real-model rankings filtered to autosomes
    - null_autosomal_variant_rankings.csv:
        type: file
        description: Null-model rankings filtered to autosomes
    - sex_chromosome_filter_summary.yaml:
        type: file
        description: Summary of sex chromosome filtering counts
  versions: &1
  - - "${task.process}":
        type: string
        description: The name of the process
    - python:
        type: string
        description: The name of the tool
    - '3.11':
        type: string
        description: The version of the tool
authors:
- "@lescai"
topics:
  versions: *1
