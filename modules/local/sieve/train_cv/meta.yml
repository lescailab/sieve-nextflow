name: "sieve_train_cv"
description: Train SIEVE with cross-validation using selected hyperparameters.
keywords:
  - sieve
  - training
  - cross validation
  - machine learning
tools:
  - sieve:
      description: Sparse Interpretable Exome Variant Explainer
      homepage: https://anaconda.org/lescailab/sieve
      documentation: https://anaconda.org/lescailab/sieve
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: Metadata map with CV run identifier
    - preprocessed:
        type: file
        description: Preprocessed tensor generated by SIEVE preprocess
    - sex_map:
        type: file
        description: Sex map TSV used as covariate metadata
    - best_params:
        type: file
        description: Selected hyperparameters YAML from grid search
    - level:
        type: string
        description: Annotation level (L0-L3)
    - cv_folds:
        type: integer
        description: Number of CV folds
output:
  - cv_bundle:
      - - meta:
            type: map
            description: Metadata map for the CV run
        - cv_output:
            type: directory
            description: CV output directory containing per-fold files
        - cv_results.yaml:
            type: file
            description: CV-level metrics summary
  - fold_dirs:
      - - meta:
            type: map
            description: Metadata map for the CV run
        - cv_output/fold_*:
            type: directory
            description: Per-fold output directories
  - versions:
      - versions.yml:
          type: file
          description: Software versions used by the process
authors:
  - "@lescai"
