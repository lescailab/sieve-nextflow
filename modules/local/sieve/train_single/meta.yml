name: "sieve_train_single"
description: Train a single SIEVE model using a validation split (no cross-validation).
keywords:
  - sieve
  - training
  - machine learning
  - val split
tools:
  - sieve:
      description: Sparse Interpretable Exome Variant Explainer
      homepage: https://anaconda.org/lescailab/sieve
      documentation: https://anaconda.org/lescailab/sieve
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: Metadata map with run identifier
    - preprocessed:
        type: file
        description: Preprocessed tensor generated by SIEVE preprocess
    - sex_map:
        type: file
        description: Sex map TSV used as covariate metadata
    - train_params:
        type: map
        description: Hyperparameter map for the run
    - level:
        type: string
        description: Annotation level (L0-L3)
    - val_split:
        type: number
        description: Validation split fraction
output:
  - train_artifacts:
      - - meta:
            type: map
            description: Metadata map with run identifier
        - results.yaml:
            type: file
            description: Training metrics file
        - config.yaml:
            type: file
            description: Training configuration file
        - best_model.pt:
            type: file
            description: Best checkpoint file
  - history:
      - - meta:
            type: map
            description: Metadata map with run identifier
        - training_history.yaml:
            type: file
            description: Optional per-epoch training history
  - selection_payload:
      - - meta:
            type: map
            description: Metadata map with run identifier
        - '*_selection_payload':
            type: directory
            description: Deterministic directory with results and config for ranking modules
  - versions:
      - versions.yml:
          type: file
          description: Software versions used by the process
authors:
  - "@lescai"
